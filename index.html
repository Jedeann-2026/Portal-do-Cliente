<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexxa - Portal do Cliente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans p-4">

    <div class="max-w-md w-full mx-auto space-y-4">
        
        <!-- TELA DE LOGIN -->
        <div id="login-screen" class="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl space-y-4 mt-6">
            <div class="text-center space-y-1">
                <div class="inline-flex bg-amber-500/10 p-3 rounded-2xl border border-amber-500/20 mb-1">
                    <i class="fa-solid fa-lock text-amber-400 text-2xl"></i>
                </div>
                <h1 class="text-lg font-bold text-amber-400">Portal Nexxa - Acesso</h1>
                <p class="text-xs text-slate-400">Entre com suas credenciais de cliente</p>
            </div>

            <form id="form-login" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Usuário / Nome</label>
                    <input type="text" id="login-user" placeholder="Digite seu usuário..." required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
                    <input type="password" id="login-pass" placeholder="********" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg mt-2">
                    Entrar no Sistema
                </button>
            </form>

            <div class="border-t border-slate-800 pt-3 flex justify-between items-center text-xs">
                <button id="btn-show-forgot" type="button" class="text-slate-400 hover:text-amber-400">
                    Esqueci a senha
                </button>
                <button id="btn-show-register" type="button" class="text-amber-400 hover:underline">
                    <i class="fa-solid fa-user-plus mr-1"></i> Novo Utilizador
                </button>
            </div>
        </div>

        <!-- TELA DE REDEFINIÇÃO DE SENHA -->
        <div id="forgot-screen" class="hidden bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl space-y-4 mt-6">
            <div class="text-center space-y-1">
                <div class="inline-flex bg-amber-500/10 p-3 rounded-2xl border border-amber-500/20 mb-1">
                    <i class="fa-solid fa-key text-amber-400 text-2xl"></i>
                </div>
                <h1 class="text-lg font-bold text-amber-400">Redefinir Senha</h1>
                <p class="text-xs text-slate-400">Informe seu usuário e loja para cadastrar nova senha</p>
            </div>

            <form id="form-forgot" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nome do Utilizador</label>
                    <input type="text" id="forgot-user" placeholder="Ex: João Silva" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Selecione a Loja</label>
                    <select id="forgot-loja" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                        <option value="">-- Escolha a Loja --</option>
                        <option value="KRIMET">KRIMET</option>
                        <option value="LAGO DI GARDA">LAGO DI GARDA</option>
                        <option value="VILA NAVAL ALBATROZ">VILA NAVAL ALBATROZ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nova Senha</label>
                    <input type="password" id="forgot-new-pass" placeholder="********" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg mt-2">
                    Atualizar Senha
                </button>
            </form>

            <div class="border-t border-slate-800 pt-3 text-center">
                <button id="btn-back-login-forgot" type="button" class="text-xs text-slate-400 hover:text-white">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Login
                </button>
            </div>
        </div>

        <!-- TELA DE CADASTRO DE NOVO UTILIZADOR -->
        <div id="register-screen" class="hidden bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl space-y-4 mt-6">
            <div class="text-center space-y-1">
                <div class="inline-flex bg-amber-500/10 p-3 rounded-2xl border border-amber-500/20 mb-1">
                    <i class="fa-solid fa-user-plus text-amber-400 text-2xl"></i>
                </div>
                <h1 class="text-lg font-bold text-amber-400">Novo Utilizador</h1>
                <p class="text-xs text-slate-400">Preencha os dados para criar o acesso</p>
            </div>

            <form id="form-register" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Nome do Utilizador</label>
                    <input type="text" id="reg-user" placeholder="Ex: João Silva" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
                    <input type="password" id="reg-pass" placeholder="********" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Selecione a Loja</label>
                    <select id="reg-loja" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                        <option value="">-- Escolha a Loja --</option>
                        <option value="KRIMET">KRIMET</option>
                        <option value="LAGO DI GARDA">LAGO DI GARDA</option>
                        <option value="VILA NAVAL ALBATROZ">VILA NAVAL ALBATROZ</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg mt-2">
                    Salvar Novo Utilizador
                </button>
            </form>

            <div class="border-t border-slate-800 pt-3 text-center">
                <button id="btn-back-login" type="button" class="text-xs text-slate-400 hover:text-white">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Login
                </button>
            </div>
        </div>

        <!-- TELA PRINCIPAL (APÓS O LOGIN) -->
        <div id="app-screen" class="hidden space-y-4">
            <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20">
                        <i class="fa-solid fa-store text-amber-400 text-lg"></i>
                    </div>
                    <div>
                        <h2 id="lbl-loja-nome" class="text-sm font-bold text-amber-400">--</h2>
                        <p id="lbl-user-nome" class="text-[10px] text-slate-400">Utilizador: --</p>
                    </div>
                </div>
                <button id="btn-logout" type="button" class="bg-slate-800 hover:bg-rose-950 text-slate-300 hover:text-rose-300 px-3 py-2 rounded-xl text-xs transition border border-slate-700" title="Sair">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>

            <div class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl space-y-2">
                <label class="block text-xs font-semibold text-slate-300">
                    <i class="fa-solid fa-magnifying-glass text-amber-400 mr-1"></i> Pesquisar Produto na sua Loja:
                </label>
                <div class="flex gap-2">
                    <input type="text" id="input-search" placeholder="Digite parte do nome..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400">
                    <button id="btn-buscar" type="button" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs transition">
                        <i class="fa-solid fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Alertas e Status -->
        <div id="status-alert" class="hidden p-3 rounded-xl text-xs text-center font-medium border"></div>

        <!-- Container de Resultados -->
        <div id="results-container" class="space-y-3"></div>

    </div>

    <script>
        const SUPABASE_URL = "https://mjkqkyuolsqhtxwzivof.supabase.co";
        const SUPABASE_KEY = "sb_publishable_taL59MpBnTvHmpfD8eMSnw_f2QuR6w-";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginScreen = document.getElementById('login-screen');
        const registerScreen = document.getElementById('register-screen');
        const forgotScreen = document.getElementById('forgot-screen');
        const appScreen = document.getElementById('app-screen');
        
        const formLogin = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const formForgot = document.getElementById('form-forgot');
        
        const loginUser = document.getElementById('login-user');
        const loginPass = document.getElementById('login-pass');
        
        const regUser = document.getElementById('reg-user');
        const regPass = document.getElementById('reg-pass');
        const regLoja = document.getElementById('reg-loja');

        const forgotUser = document.getElementById('forgot-user');
        const forgotLoja = document.getElementById('forgot-loja');
        const forgotNewPass = document.getElementById('forgot-new-pass');

        const btnShowRegister = document.getElementById('btn-show-register');
        const btnShowForgot = document.getElementById('btn-show-forgot');
        const btnBackLogin = document.getElementById('btn-back-login');
        const btnBackLoginForgot = document.getElementById('btn-back-login-forgot');
        const btnLogout = document.getElementById('btn-logout');
        
        const lblLojaNome = document.getElementById('lbl-loja-nome');
        const lblUserNome = document.getElementById('lbl-user-nome');
        const inputSearch = document.getElementById('input-search');
        const btnBuscar = document.getElementById('btn-buscar');
        const resultsContainer = document.getElementById('results-container');
        const statusAlert = document.getElementById('status-alert');

        let usuarioLogado = null;

        // Navegação de Telas
        btnShowRegister.addEventListener('click', () => {
            loginScreen.classList.add('hidden');
            registerScreen.classList.remove('hidden');
            forgotScreen.classList.add('hidden');
            hideAlert();
        });

        btnShowForgot.addEventListener('click', () => {
            loginScreen.classList.add('hidden');
            forgotScreen.classList.remove('hidden');
            registerScreen.classList.add('hidden');
            hideAlert();
        });

        btnBackLogin.addEventListener('click', () => {
            registerScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            hideAlert();
        });

        btnBackLoginForgot.addEventListener('click', () => {
            forgotScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            hideAlert();
        });

        // Redefinir Senha
        formForgot.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuarioAlvo = forgotUser.value.trim();
            const lojaAlvo = forgotLoja.value;
            const novaSenha = forgotNewPass.value.trim();

            showAlert("A atualizar senha...", "info");

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                let registroUsuarios = cloudData.find(d => d.id === 'usuarios');
                if (!registroUsuarios || !registroUsuarios.data || !Array.isArray(registroUsuarios.data)) {
                    showAlert("Nenhum utilizador cadastrado no sistema.", "warning");
                    return;
                }

                let listaUsuarios = registroUsuarios.data;

                const indexUser = listaUsuarios.findIndex(u => 
                    String(u.nome).trim().toUpperCase() === usuarioAlvo.toUpperCase() &&
                    String(u.loja).trim().toUpperCase() === lojaAlvo.toUpperCase()
                );

                if (indexUser === -1) {
                    showAlert(`Utilizador "${usuarioAlvo}" não encontrado na loja ${lojaAlvo}.`, "warning");
                    return;
                }

                listaUsuarios[indexUser].senha = novaSenha;

                const { error: updateError } = await supabaseClient
                    .from('nexxa_store')
                    .update({ data: listaUsuarios })
                    .eq('id', 'usuarios');

                if (updateError) throw updateError;

                showAlert("Senha atualizada com sucesso! Faça login.", "info");
                formForgot.reset();
                setTimeout(() => {
                    forgotScreen.classList.add('hidden');
                    loginScreen.classList.remove('hidden');
                    hideAlert();
                }, 1500);

            } catch (err) {
                console.error("Erro ao redefinir senha:", err);
                showAlert("Erro ao redefinir senha: " + err.message, "error");
            }
        });

        // Cadastrar Novo Utilizador
        formRegister.addEventListener('submit', async (e) => {
            e.preventDefault();
            const novoNome = regUser.value.trim();
            const novaSenha = regPass.value.trim();
            const novaLoja = regLoja.value;

            showAlert("A cadastrar novo utilizador...", "info");

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                let registroUsuarios = cloudData.find(d => d.id === 'usuarios');
                let listaUsuarios = [];

                if (registroUsuarios && registroUsuarios.data && Array.isArray(registroUsuarios.data)) {
                    listaUsuarios = registroUsuarios.data;
                }

                const existeNaMesmaLoja = listaUsuarios.some(u => 
                    String(u.nome).trim().toUpperCase() === novoNome.toUpperCase() && 
                    String(u.loja).trim().toUpperCase() === novaLoja.toUpperCase()
                );

                if (existeNaMesmaLoja) {
                    showAlert(`O utilizador "${novoNome}" já existe cadastrado na loja ${novaLoja}.`, "warning");
                    return;
                }

                listaUsuarios.push({ nome: novoNome, senha: novaSenha, loja: novaLoja });

                if (registroUsuarios) {
                    const { error: updateError } = await supabaseClient
                        .from('nexxa_store')
                        .update({ data: listaUsuarios })
                        .eq('id', 'usuarios');
                    if (updateError) throw updateError;
                } else {
                    const { error: insertError } = await supabaseClient
                        .from('nexxa_store')
                        .insert([{ id: 'usuarios', data: listaUsuarios }]);
                    if (insertError) throw insertError;
                }

                showAlert("Utilizador cadastrado com sucesso! Faça login.", "info");
                formRegister.reset();
                setTimeout(() => {
                    registerScreen.classList.add('hidden');
                    loginScreen.classList.remove('hidden');
                    hideAlert();
                }, 1500);

            } catch (err) {
                console.error("Erro ao cadastrar:", err);
                showAlert("Erro ao salvar utilizador: " + err.message, "error");
            }
        });

        // Gerenciar Login
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuarioDigitado = loginUser.value.trim();
            const senhaDigitada = loginPass.value.trim();

            showAlert("A autenticar...", "info");

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                const registroUsuarios = cloudData.find(d => d.id === 'usuarios');

                if (!registroUsuarios || !registroUsuarios.data || !Array.isArray(registroUsuarios.data)) {
                    showAlert("Nenhum utilizador cadastrado na base ainda. Cadastre um novo.", "warning");
                    return;
                }

                const userFound = registroUsuarios.data.find(u => 
                    String(u.nome).trim().toUpperCase() === usuarioDigitado.toUpperCase() && 
                    String(u.senha).trim() === senhaDigitada
                );

                if (!userFound) {
                    showAlert("Utilizador ou senha incorretos.", "warning");
                    return;
                }

                usuarioLogado = {
                    nome: userFound.nome,
                    loja: userFound.loja
                };

                hideAlert();
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');

                lblLojaNome.innerText = `Loja: ${usuarioLogado.loja}`;
                lblUserNome.innerText = `Utilizador: ${usuarioLogado.nome}`;
                resultsContainer.innerHTML = "";

            } catch (err) {
                console.error("Erro no login:", err);
                showAlert("Erro ao conectar com o servidor.", "error");
            }
        });

        // Logout
        btnLogout.addEventListener('click', () => {
            usuarioLogado = null;
            loginUser.value = "";
            loginPass.value = "";
            inputSearch.value = "";
            resultsContainer.innerHTML = "";
            appScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            hideAlert();
        });

        // Eventos de Busca
        btnBuscar.addEventListener('click', executarConsulta);
        inputSearch.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                executarConsulta();
            }
        });

        async function executarConsulta() {
            if (!usuarioLogado) return;
            const termo = inputSearch.value.trim().toUpperCase();

            if (!termo) {
                showAlert("Digite parte do nome do produto para pesquisar.", "warning");
                return;
            }

            showAlert(`Buscando produtos para ${usuarioLogado.loja}...`, "info");
            resultsContainer.innerHTML = "";

            try {
                const { data: cloudData, error } = await supabaseClient.from('nexxa_store').select('*');
                if (error) throw error;

                const registroVendas = cloudData.find(d => d.id === 'vendas');
                if (!registroVendas || !registroVendas.data || !Array.isArray(registroVendas.data)) {
                    showAlert("Base de preços/vendas não localizada.", "error");
                    return;
                }

                let produtosMap = {};
                const lojaDoUsuario = usuarioLogado.loja.toUpperCase();

                // Filtra restritivamente apenas os dados da loja do utilizador
                registroVendas.data.forEach(v => {
                    const clienteVenda = v.cliente ? String(v.cliente).trim().toUpperCase() : '';
                    const nomeProduto = v.produto ? String(v.produto).trim().toUpperCase() : '';
                    const ean = v.ean ? String(v.ean).trim() : '';
                    const precoUnitario = parseFloat(v.vlrUnit || 0);

                    // Validação rigorosa: ignora se não tiver EAN válido
                    if (!ean || ean === '' || ean === '0' || ean.toUpperCase() === 'S/EAN') return;

                    // Valida se pertence à loja exata e contém o termo pesquisado
                    if (clienteVenda === lojaDoUsuario && nomeProduto.includes(termo)) {
                        // Utiliza o EAN como chave única para evitar duplicações na lista
                        if (!produtosMap[ean]) {
                            produtosMap[ean] = {
                                produto: v.produto,
                                categoria: v.categoria || 'GERAL',
                                ean: ean,
                                preco: precoUnitario
                            };
                        }
                    }
                });

                const listaProdutos = Object.values(produtosMap);

                if (listaProdutos.length === 0) {
                    showAlert(`Nenhum produto com EAN válido encontrado para "${termo}" na sua loja.`, "warning");
                    return;
                }

                hideAlert();
                listaProdutos.sort((a, b) => a.produto.localeCompare(b.produto));

                listaProdutos.forEach(item => {
                    const precoFormatado = item.preco > 0 
                        ? item.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) 
                        : 'R$ 0,00';

                    const card = document.createElement('div');
                    card.className = "bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl flex justify-between items-center gap-3";
                    card.innerHTML = `
                        <div class="space-y-1">
                            <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">${item.categoria}</span>
                            <h2 class="font-bold text-white text-sm leading-snug">${item.produto}</h2>
                            <span class="text-[10px] font-mono text-slate-500">EAN: ${item.ean}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-400 block">Preço Venda</span>
                            <span class="text-base font-extrabold text-emerald-400">${precoFormatado}</span>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (err) {
                console.error("Erro na consulta:", err);
                showAlert(`Erro ao consultar dados: ${err.message}`, "error");
            }
        }

        function showAlert(msg, type) {
            statusAlert.innerText = msg;
            statusAlert.className = "p-3 rounded-xl text-xs text-center font-medium border ";
            if (type === 'error') statusAlert.classList.add('bg-rose-950/60', 'border-rose-800', 'text-rose-300');
            else if (type === 'warning') statusAlert.classList.add('bg-amber-950/60', 'border-amber-800', 'text-amber-300');
            else if (type === 'info') statusAlert.classList.add('bg-slate-900', 'border-slate-800', 'text-amber-400');
            statusAlert.classList.remove('hidden');
        }

        function hideAlert() {
            statusAlert.classList.add('hidden');
        }
    </script>
</body>
</html>
